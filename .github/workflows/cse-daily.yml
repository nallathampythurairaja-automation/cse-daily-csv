name: CSE Daily CSV

on:
  schedule:
    - cron: "30 1 * * *"   # runs daily at 07:00 Sri Lanka time
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install selenium

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run downloader
        run: |
          python dailydownload.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: cse-trade-summary
          path: data/*.csv
